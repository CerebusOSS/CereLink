name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'releases/**'
  pull_request:
    branches:
      - master
      - dev
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["release", "workflow_dispatch"]'

  build:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: "windows-x64", os: "windows-latest", cmake_extra: "", arch: "AMD64"}
          - {name: "macOS-latest", os: "macOS-latest", cmake_extra: "", arch: "auto"}
          - {name: "linux-x64", os: "ubuntu-latest", cmake_extra: "", arch: "x86_64"}
          - {name: "linux-arm64", os: "ubuntu-24.04-arm", cmake_extra: "", arch: "aarch64"}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure CBSDK
        run: |
          cmake --version
          cmake -B build -S . \
          -DCBSDK_BUILD_TEST=OFF \
          -DCBSDK_BUILD_SAMPLE=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${PWD}/install \
          -DCPACK_PACKAGE_DIRECTORY=${PWD}/dist \
          ${{ matrix.config.cmake_extra }}

      - name: Build and Package
        run: |
          cmake --build build --target install --config Release -j
          cmake --build build --target package --config Release -j

      - name: Upload C++ Packages
        uses: actions/upload-artifact@v4
        with:
          name: cpp-packages-${{ matrix.config.name }}
          path: dist/*
          if-no-files-found: ignore

      - name: Attach to Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: dist/*
